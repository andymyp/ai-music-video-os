# Alembic configuration (TDD-001 §18, MAD-001 §10, ADR-005).
# Migrations live in apps/api/migrations; env.py resolves the SQLite URL from
# application settings so it always matches the configured runtime database.

[alembic]
script_location = apps/api/migrations
prepend_sys_path = apps/api/src
path_separator = os
# SQLAlchemy URL is injected by env.py (settings-driven); do not hardcode here.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
