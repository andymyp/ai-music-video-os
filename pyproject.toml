# AI Instrumental Music Video Production OS
# Python project (FastAPI backend + Temporal worker) managed with uv.
# See docs/MAD.md (sections 7-8, 60-62, 90-92) for the technology baseline.

[project]
name = "ai-music-video-os-api"
version = "0.1.0"
description = "Backend for the AI Instrumental Music Video Production OS (local-first, provider-agnostic)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "httpx>=0.28,<1",
    "python-dotenv>=1.0,<2",
    "temporalio>=1.3,<2",
    "numpy>=2.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=6,<7",
]

[project.scripts]
amv-api = "api.main:main"
amv-worker = "api.worker.worker:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "apps/api/src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["apps/api/src"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "tests"]
pythonpath = ["apps/api/src"]
asyncio_mode = "auto"
addopts = "-ra"
